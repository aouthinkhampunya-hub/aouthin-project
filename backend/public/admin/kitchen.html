<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ຄົວ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
  <style>
        .kitchen-page {
      padding: 20px 40px;
      max-width: 1800px;
      margin: 0 auto;
    }
        .kitchen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .kitchen-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(122,31,15,0.1);
      border-left: 6px solid #d4a017;
    }
    .kitchen-card.cooking { border-left-color: #e67e22; }
        .kitchen-card h2 {
      color: #7a1f0f;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .kitchen-bulk-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .kitchen-bulk-actions button {
      flex: 1;
      min-width: 140px;
      padding: 10px 6px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }
    .btn-start-all { background: #e67e22; }
    .btn-start-all:hover { background: #d3691a; }
    .btn-done-all { background: #2e7d32; }
    .btn-done-all:hover { background: #256428; }
    .kitchen-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f7ece0;
    }
    .kitchen-item:last-child { border-bottom: none; }
    .kitchen-item-info {
      flex: 1;
      min-width: 0;
    }
    .kitchen-item-name {
      font-size: 17px;
      font-weight: 700;
      color: #2b1a12;
      word-break: break-word;
    }
    .kitchen-item-qty {
      font-size: 15px;
      color: #b8380e;
      font-weight: 800;
      margin-left: 6px;
      white-space: nowrap;
    }
            .kitchen-item-actions {
      display: flex;
      flex-direction: row;
      gap: 6px;
      flex-shrink: 0;
    }
    .kitchen-item-actions button {
      width: 110px;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      text-align: center;
    }
        @media (max-width: 640px) {
      .kitchen-item-actions {
        flex-direction: column;
        width: 110px;
      }
      .kitchen-item-actions button {
        width: 100%;
        box-sizing: border-box;
      }
    }
    .btn-start { background: #e67e22; }
    .btn-start:hover { background: #d3691a; }
    .btn-done { background: #2e7d32; }
    .btn-done:hover { background: #256428; }
    .btn-cancel { background: #c0392b; }
    .btn-cancel:hover { background: #a5281a; }
    .kitchen-empty {
      text-align: center;
      padding: 60px 20px;
      color: #8a7c6a;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
         <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ບັນທືກການສັ່ງ</a>
      <a href="tables.html">ອໍເດີ້ອາຫານ</a>
      <a href="kitchen.html">ຄົວ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <main class="kitchen-page">
    <div id="kitchen-content">
      <p style="text-align:center; padding:40px;">ກຳລັງໂຫລດ...</p>
    </div>
  </main>

  <script src="kitchen.js"></script>
  <script src="nav-active.js"></script>
</body>
</html>
