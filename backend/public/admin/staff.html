<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ພະນັກງານ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
    <style>
    #staff-table,
    #kitchen-table {
      width: 100%;
    }

    /* ຄໍລຳສຸດທ້າຍ (ປຸ່ມ): ຫຍໍ້ຕາມເນື້ອໃນ ແລະ ຊິດຂວາ */
    #staff-table th:last-child,
    #staff-table td:last-child,
    #kitchen-table th:last-child,
    #kitchen-table td:last-child {
      white-space: nowrap;
      text-align: right;
    }

    .staff-actions {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      gap: 6px;
    }
    .staff-actions button {
      width: 110px;
      box-sizing: border-box;
    }

    /* ຫົວຂໍ້ຂອງແຕ່ລະສ່ວນ */
    .staff-section-title {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 800;
      color: #7a1f0f;
    }
    .staff-section-title.kitchen { margin-top: 40px; }
    .staff-section-note {
      margin: 0 0 12px;
      color: #6b5a4c;
      font-size: 14px;
      line-height: 1.6;
    }
    .staff-empty-row td {
      text-align: center !important;
      color: #6b5a4c;
    }

    @media (max-width: 640px) {
      .staff-actions {
        flex-direction: column;
        width: 110px;
        margin-left: auto;
      }
      .staff-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
    <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ບັນທືກການສັ່ງ</a>
      <a href="tables.html">ອໍເດີ້ອາຫານ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <main>
    <!-- ===== ສ່ວນ 1: ພະນັກງານ ===== -->
    <h2 class="staff-section-title">👥 ພະນັກງານ</h2>
    <button type="button" class="confirm-btn" onclick="openAddStaff('staff')" style="display:inline-block; width:auto; margin-bottom:16px; border:none; cursor:pointer;">➕ ເພີ່ມພະນັກງານ</button>

    <table id="staff-table">
      <tr><th>ລະຫັດ</th><th>Username</th><th>ຊື່</th><th>ບົດບາດ</th><th></th></tr>
    </table>

    <!-- ===== ສ່ວນ 2: ພະນັກງານຄົວ ===== -->
    <h2 class="staff-section-title kitchen">👨‍🍳 ພະນັກງານຄົວ</h2>
    <p class="staff-section-note">ບັນຊີຄົວເຂົ້າໄດ້ສະເພາະໜ້າຄົວ ທີ່ລິ້ງ <b id="kitchen-login-url"></b></p>
    <button type="button" class="confirm-btn" onclick="openAddStaff('kitchen')" style="display:inline-block; width:auto; margin-bottom:16px; border:none; cursor:pointer;">➕ ເພີ່ມພະນັກງານຄົວ</button>

    <table id="kitchen-table">
      <tr><th>ລະຫັດ</th><th>Username</th><th>ຊື່</th><th>ບົດບາດ</th><th></th></tr>
    </table>

    <div id="reset-modal" class="modal-overlay">
  <div class="modal-box">
    <p id="reset-modal-text">ໃສ່ລະຫັດຜ່ານໃໝ່</p>
    <input type="text" id="reset-modal-input" placeholder="ລະຫັດຜ່ານໃໝ່">
    <div class="modal-buttons">
      <button id="reset-modal-cancel" class="cancel-btn">ຍົກເລີກ</button>
      <button id="reset-modal-ok" class="confirm-btn">ບັນທຶກ</button>
    </div>
  </div>
</div>
<div id="delete-modal" class="modal-overlay">
  <div class="modal-box">
    <p id="delete-modal-text">ຢືນຢັນລົບ?</p>
    <div class="modal-buttons">
      <button id="delete-modal-cancel" class="cancel-btn">ຍົກເລີກ</button>
      <button id="delete-modal-ok" class="delete-btn">ລົບ</button>
    </div>
  </div>
</div>
<div id="notice-modal" class="modal-overlay">
  <div class="modal-box">
    <p id="notice-modal-text"></p>
    <div class="modal-buttons">
      <button id="notice-modal-ok" class="confirm-btn">OK</button>
    </div>
  </div>
</div>
  </main>

  <script src="staff.js"></script>
  <script src="nav-active.js"></script>
</body>
</html>
