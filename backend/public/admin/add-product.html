<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ເພີ່ມເມນູໃໝ່</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="/admin/auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
    <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ຄຳສັ່ງອາຫານ</a>
      <a href="tables.html">ໂຕະອາຫານ</a>
      <a href="kitchen.html">ຄົວ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <main>
     <a href="index.html" class="back-link">
  <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="12 19 5 12 12 5"></polyline>
  </svg>
  ກັບ
</a>

    <section class="add-form">
      <h2>ເພີ່ມເມນູໃໝ່</h2>
      <input type="text" id="name" placeholder="ຊື່ເມນູ">
      <input type="number" id="price" placeholder="ລາຄາ" max="1000000" min="0">

      <div style="display:flex; gap:4px; align-items:center;">
        <select id="size" style="flex:1;"></select>
        <button type="button" onclick="openAddOptionModal('category')" title="ເພີ່ມປະເພດໃໝ່" style="padding:8px 12px;">+</button>
        <button type="button" onclick="removeOption('category')" title="ລຶບປະເພດທີ່ເລືອກ" style="padding:8px 12px; background:#b8380e;">🗑</button>
      </div>

      <div style="display:flex; gap:4px; align-items:center;">
        <select id="color" style="flex:1;"></select>
        <button type="button" onclick="openAddOptionModal('spice')" title="ເພີ່ມລະດັບໃໝ່" style="padding:8px 12px;">+</button>
        <button type="button" onclick="removeOption('spice')" title="ລຶບລະດັບທີ່ເລືອກ" style="padding:8px 12px; background:#b8380e;">🗑</button>
      </div>

      <input type="number" id="stock" placeholder="ຈຳນວນ (ຈານ)" max="100" min="0">
      <input type="file" id="image" accept="image/*">
      <button onclick="addProduct()">ບັນທຶກເມນູ</button>
    </section>
  </main>

  <div id="option-modal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:999;">
    <div style="background:white; padding:28px; border-radius:16px; width:85%; max-width:320px; box-shadow:0 12px 30px rgba(0,0,0,0.3);">
      <h3 id="option-modal-title" style="margin:0 0 14px; color:#7a1f0f; font-size:17px;"></h3>
      <input type="text" id="option-modal-input" style="width:100%; padding:11px; border:2px solid #e8d5c4; border-radius:8px; box-sizing:border-box; font-size:14px; margin-bottom:14px;">
      <div style="display:flex; gap:8px;">
        <button onclick="submitOptionModal()" style="flex:1; padding:11px; background:#2e7d32; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">ບັນທຶກ</button>
        <button onclick="closeOptionModal()" style="flex:1; padding:11px; background:#8a7c6a; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">ຍົກເລີກ</button>
      </div>
    </div>
  </div>
    <div id="confirm-delete-modal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:999;">
    <div style="background:white; padding:28px; border-radius:16px; width:85%; max-width:320px; box-shadow:0 12px 30px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="confirm-delete-text" style="margin:0 0 20px; color:#7a1f0f; font-size:17px;"></h3>
      <div style="display:flex; gap:8px;">
        <button onclick="confirmDeleteYes()" style="flex:1; padding:11px; background:#b8380e; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">ລຶບ</button>
        <button onclick="confirmDeleteNo()" style="flex:1; padding:11px; background:#8a7c6a; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">ຍົກເລີກ</button>
      </div>
    </div>
  </div>
    <div id="alert-modal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:999;">
    <div style="background:white; padding:28px; border-radius:16px; width:85%; max-width:320px; box-shadow:0 12px 30px rgba(0,0,0,0.3); text-align:center;">
      <p id="alert-modal-text" style="margin:0 0 20px; color:#7a1f0f; font-size:15px;"></p>
      <button onclick="closeAlertModal()" style="width:100%; padding:11px; background:#b8380e; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">ຕົກລົງ</button>
    </div>
  </div>

  <script src="add-product.js"></script>
</body>
</html>
