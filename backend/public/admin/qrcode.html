<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code ຮ້ານອາຫານ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .qr-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      min-height: calc(100vh - 70px);
      background: linear-gradient(135deg, #7a1f0f, #b8380e);
    }
    .qr-page h2 {
      margin-bottom: 24px;
      color: #fff3e0;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .qr-box {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }
    .qr-box img {
      border-radius: 10px;
      display: block;
    }
    .qr-page p {
      margin-top: 18px;
      color: #ffe0cc;
      font-size: 13px;
      text-align: center;
    }

    /* ===== ປັອບອັບ QR ຈ່າຍເງິນ ===== */
    .pay-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43,27,14,0.65);
      display: none;
      align-items: center; justify-content: center;
      z-index: 9000; padding: 16px; overflow-y: auto;
    }
    .pay-modal-overlay.open { display: flex; }
    .pay-modal-box {
      background: white; border-radius: 16px; width: 100%; max-width: 380px;
      padding: 26px 24px; position: relative; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .pay-modal-close {
      position: absolute; top: 8px; right: 14px; background: none; border: none;
      font-size: 28px; line-height: 1; cursor: pointer; color: #8a7c6a;
    }
    .pay-modal-box h3 { color: #7a1f0f; margin-bottom: 20px; }
    .pay-qr-preview {
      width: 220px; height: 220px; border-radius: 12px;
      border: 2px dashed #e8d5c4; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 20px; overflow: hidden;
      background: #fff8f0;
    }
    .pay-qr-preview img { width: 100%; height: 100%; object-fit: contain; }
    .pay-qr-preview span { color: #8a7060; font-size: 13px; }
    .pay-modal-box input[type="file"] { margin-bottom: 16px; width: 100%; }
    .pay-upload-btn {
      width: 100%; padding: 13px; background: #2e7d32; color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .pay-upload-btn:hover { background: #256428; }

    /* ===== ກະດານ QR ຕາມໂຕະ ===== */
    .table-qr-section {
      width: 100%;
      max-width: 1100px;
      margin-top: 36px;
    }
    .table-qr-section h2 {
      color: #fff3e0;
      text-align: center;
      font-size: 20px;
      margin-bottom: 18px;
    }
    .table-qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .table-qr-card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .table-qr-card img {
      width: 100%;
      max-width: 140px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 8px;
    }
    .table-qr-card .tq-label {
      color: #7a1f0f;
      font-weight: 800;
      font-size: 15px;
    }

    /* ===== ປຸ່ມເພີ່ມ / ລຶບ / ພິມ ===== */
    .table-qr-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .table-qr-print-btn {
      background: #2B1B0E;
      color: #FFC93C;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .table-qr-print-btn:hover { background: #3D2A18; }
    .table-qr-add-btn {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .table-qr-add-btn:hover { background: #256428; }
    .table-qr-add-btn:disabled { opacity: .6; cursor: wait; }
    .table-qr-del-btn {
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .table-qr-del-btn:hover { background: #a5301f; }
    .table-qr-del-btn:disabled { opacity: .6; cursor: wait; }

    /* ===== ປັອບອັບຢືນຢັນ (ແທນ confirm) ===== */
    .cf-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20,12,6,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; padding: 20px;
      animation: cfFadeIn 0.2s ease;
    }
    .cf-box {
      background: #fff; border-radius: 22px; width: 100%; max-width: 340px;
      padding: 36px 28px 28px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      animation: cfPopIn 0.25s ease;
    }
    .cf-icon {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
      font-size: 34px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(150deg, #ff8a65, #c0392b);
      box-shadow: 0 8px 20px rgba(192,57,43,0.35);
    }
    .cf-icon.warn {
      background: linear-gradient(150deg, #FFC93C, #F2760C);
      box-shadow: 0 8px 20px rgba(242,118,12,0.35);
    }
    .cf-box h3 { margin: 0 0 8px; color: #2B1B0E; font-size: 19px; font-weight: 800; }
    .cf-box p {
      margin: 0 0 26px; color: #6b5a4a; font-size: 14px; line-height: 1.5;
      text-align: center;
    }
    .cf-actions { display: flex; gap: 10px; }
    .cf-actions button {
      flex: 1; padding: 13px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .cf-cancel { background: #f3ece4; color: #7a1f10; }
    .cf-cancel:hover { background: #e8dccf; }
    .cf-ok { background: #c0392b; color: #fff; box-shadow: 0 6px 16px rgba(192,57,43,0.35); }
    .cf-ok:hover { background: #a5301f; }
    .cf-ok.green { background: #3C8031; box-shadow: 0 6px 16px rgba(60,128,49,0.35); }
    .cf-ok.green:hover { background: #2C601E; }

    /* ===== Toast ແທນ alert ===== */
    .qr-toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      background: #2B1B0E; color: #FFC93C; padding: 12px 22px;
      border-radius: 999px; font-weight: 700; font-size: 15px;
      z-index: 10002; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 90vw; text-align: center;
    }
    @keyframes cfFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cfPopIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @media print {
      body > *:not(.table-qr-section) { display: none !important; }
      .qr-page { display: none !important; }
      .table-qr-section { margin-top: 0; max-width: 100%; }
      .table-qr-section h2 { color: #2B1B0E; }
      .table-qr-actions { display: none !important; }
      .table-qr-grid { grid-template-columns: repeat(4, 1fr); }
      .table-qr-card { box-shadow: none; border: 1px solid #e5d9cc; break-inside: avoid; }
      .cf-overlay, .qr-toast { display: none !important; }
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <script src="nav-active.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
    <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ບັນທືກການສັ່ງ</a>
      <a href="tables.html">ອໍເດີ້ອາຫານ</a>
      <a href="kitchen.html">ຄົວ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <div class="qr-page">
    <button class="confirm-btn" style="margin-bottom:10px;" onclick="openPayModal()">➕ ໄປທີ່ QR ຈ່າຍເງິນ</button>
    <h2>ສະແກນເພື່ອສັ່ງອາຫານ</h2>
    <div class="qr-box">
      <img id="qr-img" src="" alt="QR Code" width="280" height="280">
    </div>
    <p id="qr-url"></p>

    <div class="table-qr-section">
      <h2>📋 QR ແຍກຕາມໂຕະ (<span id="table-count">...</span>)</h2>
      <div class="table-qr-grid" id="table-qr-grid">
        <p style="color:#ffe0cc; text-align:center;">ກຳລັງສ້າງ QR...</p>
      </div>
      <div class="table-qr-actions">
        <button class="table-qr-add-btn" id="add-table-btn" onclick="addTable()">➕ ເພີ່ມໂຕະ</button>
        <button class="table-qr-del-btn" id="del-table-btn" onclick="deleteTable()">🗑️ ລຶບໂຕະສຸດທ້າຍ</button>
        <button class="table-qr-print-btn" onclick="window.print()">🖨️ ພິມ QR ທັງໝົດ</button>
      </div>
    </div>
  </div>

  <div class="pay-modal-overlay" id="pay-modal-overlay">
    <div class="pay-modal-box">
      <button class="pay-modal-close" onclick="closePayModal()">×</button>
      <h3>QR ຮັບເງິນ</h3>
      <div class="pay-qr-preview" id="pay-qr-preview">
        <span>ຍັງບໍ່ມີຮູບ QR</span>
      </div>
      <input type="file" id="pay-qr-input" accept="image/*">
      <button class="pay-upload-btn" onclick="uploadPayQR()">ບັນທຶກ QR</button>
    </div>
  </div>

  <script>
    // ===== Toast (ແທນ alert) =====
    function showToast(message) {
      const old = document.getElementById('qr-toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.id = 'qr-toast';
      t.className = 'qr-toast';
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    // ===== ປັອບອັບຢືນຢັນ (ແທນ confirm) =====
    // ໃຊ້: if (await askConfirm({...})) { ... }
    function askConfirm({ icon = '🗑️', title, text, okText = 'ຢືນຢັນ', cancelText = 'ຍົກເລີກ', danger = true }) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'cf-overlay';
        overlay.innerHTML = `
          <div class="cf-box">
            <div class="cf-icon ${danger ? '' : 'warn'}">${icon}</div>
            <h3>${title}</h3>
            <p>${text}</p>
            <div class="cf-actions">
              <button class="cf-cancel">${cancelText}</button>
              <button class="cf-ok ${danger ? '' : 'green'}">${okText}</button>
            </div>
          </div>
        `;

        function close(result) {
          document.removeEventListener('keydown', onKey);
          overlay.remove();
          resolve(result);
        }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          if (e.key === 'Enter') close(true);
        }

        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) close(false);
        });
        overlay.querySelector('.cf-cancel').onclick = () => close(false);
        overlay.querySelector('.cf-ok').onclick = () => close(true);
        document.addEventListener('keydown', onKey);
        document.body.appendChild(overlay);
        overlay.querySelector('.cf-ok').focus();
      });
    }

    // ===== QR ຫຼັກ =====
    async function loadQR() {
      const res = await fetch('/api/qrcode');
      const data = await res.json();
      document.getElementById('qr-img').src = data.qrImage;
      document.getElementById('qr-url').textContent = data.menuUrl;
    }
    loadQR();

    // ===== ກະດານ QR ຕາມໂຕະ =====
    async function loadTableQRs() {
      const grid = document.getElementById('table-qr-grid');
      try {
        const res = await fetch('/api/qrcode/tables');
        const data = await res.json();

        document.getElementById('table-count').textContent = '1-' + data.tables.length;
        grid.innerHTML = data.tables.map(t => `
          <div class="table-qr-card">
            <img src="${t.qrImage}" alt="QR ໂຕະ ${t.table}">
            <div class="tq-label">ໂຕະ ${t.table}</div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<p style="color:#ffe0cc; text-align:center;">ສ້າງ QR ບໍ່ສຳເລັດ ລອງໂຫລດໜ້ານີ້ໃໝ່</p>';
      }
    }
    loadTableQRs();

    // ===== ເພີ່ມໂຕະ =====
    async function addTable() {
      const btn = document.getElementById('add-table-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/tables', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'ເພີ່ມໂຕະບໍ່ສຳເລັດ');
        await loadTableQRs();
        showToast('✅ ເພີ່ມໂຕະ ' + data.count + ' ແລ້ວ');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } catch (err) {
        showToast('❌ ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ===== ລຶບໂຕະສຸດທ້າຍ =====
    async function deleteTable() {
      const btn = document.getElementById('del-table-btn');
      btn.disabled = true;
      try {
        const countRes = await fetch('/api/tables/count');
        const { count } = await countRes.json();

        const billsRes = await fetch('/api/orders/bills');
        const bills = await billsRes.json();
        if (bills.some(b => Number(b.table_number) === count)) {
          await askConfirm({
            icon: '⚠️',
            title: 'ລຶບບໍ່ໄດ້',
            text: `ໂຕະ ${count} ຍັງມີບິນເປີດຢູ່<br>ກະລຸນາປິດບິນກ່ອນ`,
            okText: 'ຮັບຮູ້',
            cancelText: 'ປິດ',
            danger: false
          });
          return;
        }

        const ok = await askConfirm({
          icon: '🗑️',
          title: 'ຢືນຢັນລຶບໂຕະ',
          text: `ລຶບໂຕະ ${count} ແທ້ບໍ່?<br>QR ຂອງໂຕະນີ້ຈະໃຊ້ບໍ່ໄດ້ອີກ`,
          okText: '🗑️ ລຶບ',
          cancelText: 'ຍົກເລີກ'
        });
        if (!ok) return;

        const res = await fetch('/api/tables', { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'ລຶບໂຕະບໍ່ສຳເລັດ');
        await loadTableQRs();
        showToast('✅ ລຶບໂຕະ ' + count + ' ແລ້ວ');
      } catch (err) {
        showToast('❌ ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ===== ປັອບອັບ QR ຈ່າຍເງິນ =====
    function openPayModal() {
      document.getElementById('pay-modal-overlay').classList.add('open');
      loadPayQR();
    }

    function closePayModal() {
      document.getElementById('pay-modal-overlay').classList.remove('open');
    }

    document.getElementById('pay-modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'pay-modal-overlay') closePayModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePayModal();
    });

    async function loadPayQR() {
      const res = await fetch('/api/settings/qr');
      const data = await res.json();

      const preview = document.getElementById('pay-qr-preview');
      if (data.qrImage) {
        preview.innerHTML = `<img src="${data.qrImage}" alt="QR ຮັບເງິນ">`;
      } else {
        preview.innerHTML = `<span>ຍັງບໍ່ມີຮູບ QR</span>`;
      }
    }

    async function uploadPayQR() {
      const input = document.getElementById('pay-qr-input');
      const file = input.files[0];

      if (!file) {
        showToast('ກະລຸນາເລືອກຮູບ QR ກ່ອນ');
        return;
      }

      const formData = new FormData();
      formData.append('qr', file);

      const res = await fetch('/api/settings/qr', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (res.ok) {
        showToast('✅ ບັນທຶກ QR ສຳເລັດ');
        input.value = '';
        loadPayQR();
      } else {
        showToast('❌ ' + (data.error || 'ເກີດຂໍ້ຜິດພາດ'));
      }
    }
  </script>
</body>
</html>
