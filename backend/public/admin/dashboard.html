<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ລາຍງານ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
      <style>
    .chart-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(122,31,15,0.08);
      margin-bottom: 24px;
    }
    .chart-box h2 { color: #7a1f0f; margin-bottom: 20px; font-size: 17px; }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 220px;
      gap: 20px;
      padding: 0 10px;
    }
    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-value {
      font-size: 12px;
      font-weight: 700;
      color: #7a1f0f;
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .bar-fill {
      width: 60%;
      max-width: 70px;
      background: linear-gradient(180deg, #f2760c, #b8380e);
      border-radius: 8px 8px 0 0;
      transition: height 0.4s ease;
      min-height: 4px;
    }
    .bar-label {
      margin-top: 10px;
      font-size: 12px;
      color: #8a7c6a;
      text-align: center;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(122,31,15,0.08);
      border-top: 4px solid #b8380e;
    }
    .stat-card .label { color: #8a7c6a; font-size: 13px; margin-bottom: 6px; }
    .stat-card .value { color: #7a1f0f; font-size: 26px; font-weight: 800; }
    .stat-card .sub { color: #8a7c6a; font-size: 12px; margin-top: 4px; }
    .top-items {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(122,31,15,0.08);
    }
    .top-items h2 { color: #7a1f0f; margin-bottom: 14px; font-size: 17px; }
    .top-item-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f7ece0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
    <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ຄຳສັ່ງອາຫານ</a>
      <a href="tables.html">ໂຕະອາຫານ</a>
      <a href="kitchen.html">ຄົວ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <main>
        <div class="chart-box">
      <h2>📊 ປຽບທຽບຍອດຂາຍ</h2>
      <div class="bar-chart" id="revenue-chart"></div>
    </div>

    <div class="stats-grid" id="stats-grid">
      <p>ກຳລັງໂຫລດ...</p>
    </div>

    <div class="top-items">
      <h2>🔥 ເມນູຂາຍດີ (ອາທິດນີ້)</h2>
      <div id="top-items-list"></div>
    </div>
  </main>

  <script src="dashboard.js"></script>
  <script src="nav-active.js"></script>
</body>
</html>
