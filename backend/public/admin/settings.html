<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ຕັ້ງຄ່າ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .settings-page {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .settings-card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(43,27,14,0.08);
      text-align: center;
    }
    .settings-card h2 {
      color: #7a1f0f;
      margin-bottom: 20px;
    } 
    .qr-preview {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      border: 2px dashed #e8d5c4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
      background: #fff8f0;
    }
    .qr-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .qr-preview span {
      color: #8a7060;
      font-size: 13px;
    }
    input[type="file"] {
      margin-bottom: 16px;
      width: 100%;
    }
    .upload-btn {
      width: 100%;
      padding: 13px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .upload-btn:hover {
      background: #256428;
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <header>
    <h2>ຈັດການຮ້ານອາຫານ</h2>
  </header>
   <main>
   <a href="qrcode.html" class="back-link">
  <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="12 19 5 12 12 5"></polyline>
  </svg>
  ກັບ
</a>

  <main class="settings-page">
    <div class="settings-card">
      <h3>QR ຮັບເງິນ</h3>
      <div class="qr-preview" id="qr-preview">
        <span>ຍັງບໍ່ມີຮູບ QR</span>
      </div>
      <input type="file" id="qr-input" accept="image/*">
      <button class="upload-btn" onclick="uploadQR()">ບັນທຶກ QR</button>
    </div>
  </main>

  <script src="settings.js"></script>
</body>
</html>
