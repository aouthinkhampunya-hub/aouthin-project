<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ຄຳສັ່ງອາຫານ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ຮ້ານອາຫານຕາມສັ່ງ AOUTHIN</h1>
    <p id="table-label"></p>
  </header>

  <div class="filter-bar">
    <select id="category-filter" onchange="filterProducts()">
      <option value="">ທຸກປະເພດ</option>
    </select>
  </div>

  <main id="product-list">
    <p>ກຳລັງໂຫລດ...</p>
  </main>

  <button id="cart-button" onclick="openCart()">
    🛒 ກະຕ່າ (<span id="cart-count">0</span>)
  </button>

  <div class="left-buttons">
    <button id="bill-button" onclick="goToBill()">🧾 ເບິ່ງບິນ</button>
    <button id="call-staff-button" onclick="callStaff()">🔔 ເອີ້ນພະນັກງານ</button>
  </div>
  
  <div id="cart-overlay" class="hidden">
    <div class="cart-box">
      <h2>ກະຕ່າອາຫານ</h2>
      <div id="cart-items"></div>
      <p class="cart-total">ລວມ: <span id="cart-total">0</span> ກີບ</p>
      <button class="confirm-btn" onclick="confirmCartOrder()">ຢືນຢັນສັ່ງອາຫານ</button>
      <button class="cancel-btn" onclick="closeCart()">ປິດ</button>
    </div>
  </div>

  <!-- 👇 ໃສ່ຕົງນີ້ (ຫຼັງ cart-overlay, ກ່ອນ script.js) -->
  <div id="success-overlay" class="hidden">
    <div class="success-box">
      <div class="success-icon">🍽️</div>
      <h2>ສັ່ງອາຫານສຳເລັດ!</h2>
      <p>ອາຫານຂອງທ່ານກຳລັງຖືກກຽມ ກະລຸນາລໍຖ້າ</p>
      <button class="success-btn" onclick="closeSuccess()">ຕົກລົງ</button>
    </div>
  </div>

    <div id="table-modal">
    <div class="table-modal-box">
      <h2>ກະລຸນາປ້ອນເລກໂຕະ</h2>
      <p class="table-modal-sub">ຕ້ອງໃສ່ເລກໂຕະກ່ອນຈຶ່ງເບິ່ງເມນູໄດ້</p>
      <input type="text" id="table-input" inputmode="numeric" autofocus>   
      <p id="table-error" class="table-error hidden">⚠️ ກະລຸນາໃສ່ເລກໂຕະ</p>
      <button class="confirm-btn" onclick="submitTableNumber()">ຢືນຢັນ</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
