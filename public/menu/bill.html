<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>ບິນ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ບິນຂອງທ່ານ</h1>
    <p id="table-label"></p>
  </header>

  <main class="bill-page">
    <div id="bill-content">
      <p>ກຳລັງໂຫລດ...</p>
    </div>
    <a href="index.html" class="back-link">
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        ກັບ
      </a>
  </main>
  <div id="cancel-confirm-overlay" class="hidden">
    <div class="confirm-box">
      <div class="icon-circle">🗑️</div>
      <h3>ຍົກເລີກອໍເດີ້</h3>
      <p>ຢືນຢັນວ່າຈະຍົກເລີກລາຍການອາຫານນີ້?</p>
      <div class="confirm-actions">
        <button class="confirm-cancel-red" onclick="closeCancelConfirm()">ຍົກເລີກ</button>
        <button class="confirm-yes" onclick="doCancelOrder()">ຢືນຢັນ</button>
      </div>
    </div>
  </div>

  <script src="bill.js"></script>
</body>
</html>
