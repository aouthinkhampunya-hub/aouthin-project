<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>QR Code ຮ້ານອາຫານ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .qr-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      min-height: calc(100vh - 70px);
      background: linear-gradient(135deg, #7a1f0f, #b8380e);
    }
    .qr-page h2 {
      margin-bottom: 24px;
      color: #fff3e0;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .qr-box {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }
    .qr-box img {
      border-radius: 10px;
      display: block;
    }
    .qr-page p {
      margin-top: 18px;
      color: #ffe0cc;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <script src="nav-active.js"></script>
  <header>
    <h1>ຈັດການຮ້ານອາຫານ</h1>
    <nav>
      <a href="index.html">ເມນູ</a>
      <a href="orders.html">ຄຳສັ່ງອາຫານ</a>
      <a href="tables.html">ໂຕະອາຫານ</a>
      <a href="qrcode.html">QR Code</a>
      <a href="dashboard.html">ລາຍງານ</a>
      <a href="staff.html">ພະນັກງານ</a>
    </nav>
  </header>

  <div class="qr-page">
    <h2>ສະແກນເພື່ອສັ່ງອາຫານ</h2>
    <div class="qr-box">
      <img id="qr-img" src="" alt="QR Code" width="280" height="280">
    </div>
    <p id="qr-url"></p>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/qrcode');
      const data = await res.json();
      document.getElementById('qr-img').src = data.qrImage;
      document.getElementById('qr-url').textContent = data.menuUrl;
    }
    loadQR();
  </script>
</body>
</html>
