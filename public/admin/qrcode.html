<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>QR Code ຮ້ານອາຫານ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', 'Noto Sans Lao', sans-serif;
      background: linear-gradient(135deg, #7a1f0f, #b8380e);
    }
    h1 {
      margin-bottom: 24px;
      color: #fff3e0;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .qr-box {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }
    img {
      border-radius: 10px;
      display: block;
    }
    p {
      margin-top: 18px;
      color: #ffd9b3;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>ສະແກນເພື່ອສັ່ງອາຫານ</h1>
  <div class="qr-box">
    <img id="qr-img" src="" alt="QR Code" width="280" height="280">
  </div>
  <p id="qr-url"></p>

  <script>
    async function loadQR() {
      const res = await fetch('/api/qrcode');
      const data = await res.json();
      document.getElementById('qr-img').src = data.qrImage;
      document.getElementById('qr-url').textContent = data.menuUrl;
    }
    loadQR();
  </script>
</body>
</html>
