<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>ໃບບິນ - AOUTHIN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bill-page {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 16px 60px;
    }
    .receipt {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(43,27,14,0.1);
    }
    .receipt-header {
      text-align: center;
      border-bottom: 2px dashed var(--cream-dark);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .receipt-header h2 {
      color: var(--brown);
      font-size: 20px;
      margin-bottom: 4px;
    }
    .receipt-header p {
      color: var(--muted);
      font-size: 13px;
    }
    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }
    .receipt-table th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      padding: 6px 4px;
      border-bottom: 1px solid var(--cream-dark);
    }
    .receipt-table td {
      padding: 8px 4px;
      font-size: 14px;
      border-bottom: 1px solid var(--cream-dark);
    }
    .receipt-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 2px dashed var(--cream-dark);
      margin-bottom: 20px;
    }
    .receipt-total span:first-child {
      font-size: 15px;
      color: var(--muted);
    }
    .receipt-total span:last-child {
      font-size: 24px;
      font-weight: 800;
      color: var(--brown);
    }
    .qr-section {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 16px;
      border-top: 2px dashed var(--cream-dark);
    }
    .qr-section p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .qr-section img {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      border: 1px solid var(--cream-dark);
    }
    .bill-actions {
      display: flex;
      gap: 12px;
    }
    .bill-actions button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .bill-actions button:active {
      transform: scale(0.97);
    }
    .btn-print {
      background: #2B1B0E !important;
      color: #FFC93C !important;
      box-shadow: 0 4px 12px rgba(43,27,14,0.25);
    }
    .btn-print:hover { background: #3D2A18 !important; }
    .btn-confirm {
      background: #3C8031 !important;
      color: white !important;
      box-shadow: 0 6px 16px rgba(60,128,49,0.35);
    }
    .btn-confirm:hover { background: #2C601E !important; }

    #confirm-overlay {
      position: fixed;
      top: 0; left: 0;
      right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: rgba(20,12,6,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    #confirm-overlay.hidden { display: none !important; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .confirm-box {
      background: #ffffff;
      border-radius: 22px;
      padding: 36px 28px 28px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      animation: popIn 0.25s ease;
    }
    .confirm-box .icon-circle {
      width: 72px;
      height: 72px;
      background: linear-gradient(150deg, var(--yellow), var(--orange));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 34px;
      box-shadow: 0 8px 20px rgba(242,118,12,0.35);
    }
    .confirm-box h3 {
      color: var(--brown);
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .confirm-box p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 26px;
    }
    .confirm-actions {
      display: flex;
      gap: 10px;
    }
    .confirm-actions button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .confirm-actions button:active {
      transform: scale(0.97);
    }
    .confirm-yes {
      background: #3C8031 !important;
      color: white !important;
      box-shadow: 0 6px 16px rgba(60,128,49,0.35);
    }
    .confirm-yes:hover { background: var(--green-dark); }
    .confirm-no {
      background: #c0392b;
      color: white;
    }
    .confirm-no:hover { background: #a5301f; }

    @media print {
      header, .bill-actions, #bill-button, #cart-button, #confirm-overlay { display: none !important; }
      body { background: white; }
      .receipt { box-shadow: none; }
    }
  </style>
</head>
<body>
  <script src="auth-guard.js"></script>
  <header>
    <h1>ໃບບິນ</h1>
  </header>

  <main class="bill-page">
    <div id="receipt-container">
      <p style="text-align:center; padding:40px;">ກຳລັງໂຫລດ...</p>
    </div>
  </main>

  <div id="confirm-overlay" class="hidden">
    <div class="confirm-box">
      <div class="icon-circle">💰</div>
      <h3>ຢືນຢັນຮັບເງິນ</h3>
      <p>ໂຕະນີ້ຈ່າຍເງິນຄົບຖ້ວນແລ້ວແທ້ບໍ່?<br>ການດຳເນີນການນີ້ຈະປິດບິນ</p>
      <div class="confirm-actions">
        <button class="confirm-no" onclick="closeConfirm()">ຍົກເລີກ</button>
        <button class="confirm-yes" onclick="doConfirmPaid()">✓ ຢືນຢັນ</button>
      </div>
    </div>
  </div>

  <script src="bill.js"></script>
</body>
</html>
